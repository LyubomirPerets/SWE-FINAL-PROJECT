      <main class="app-main">

            <button class="btn btn-ghost btn-new" id="new-post-top-btn" type="button">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"

                <path d="M12 5v14M5 12h14" />
              </svg>
              New post

                width="16"
                height="16"
                viewBox="0 0 24 24"

                stroke-width="2.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
              New contact

        </div>

        <div class="toolbar">
          <input
            class="field-dark grow"
            id="q"
            type="search"
            placeholder="Search by name, email, phone, or address"

          <select class="field-dark" id="status" aria-label="Filter by status">
            <option value="">All statuses</option>
          </select>
          <select class="field-dark" id="service" aria-label="Filter by service">
            <option value="">All services</option>

        <div class="panel">
          <table class="list" id="table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col" class="c-svc">Service</th>
                <th scope="col">Status</th>
                <th scope="col" class="c-phone">Phone</th>
                <th scope="col">Next follow-up</th>
                <th scope="col" class="c-actions">Action</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden></div>
        </div>

        <section class="posts-section" aria-label="Posts related to contacts">

            <div>

              <p id="posts-count" aria-live="polite"></p>

            <button class="btn btn-violet btn-new" id="new-post-btn" type="button">

                width="16"
                height="16"

                stroke="currentColor"
                stroke-width="2.5"

              class="field-dark grow"
              id="post-q"
              type="search"
              placeholder="Search posts by content, title, or contact name"
              aria-label="Search posts"
            />
            <select
              class="field-dark"
              id="post-contact-filter"
              aria-label="Filter posts by contact"
            >
              <option value="">All contacts</option>
            </select>

              <option value="">All types</option>
            </select>

    <script src="app.js"></script>
    <script>
      (function () {
        var S = window.Sierra;
        var $ = function (id) {
          return document.getElementById(id);
        };
        var rows = $('rows'),
          table = $('table'),
          empty = $('empty');
        var postsList = $('posts-list'),
          postsEmpty = $('posts-empty');
        var postContactFilter = $('post-contact-filter'),
          postTypeFilter = $('post-type-filter'),
          postQ = $('post-q');

        S.STATUSES.forEach(function (v) {
          $('status').add(new Option(v, v));
        });
        S.SERVICES.forEach(function (v) {
          $('service').add(new Option(v, v));
        });
        S.POST_TYPES.forEach(function (v) {
          postTypeFilter.add(new Option(v, v));
        });

        function updateContactFilterOptions() {
          var currentVal = postContactFilter.value;
          var contacts = S.all().sort(function (a, b) {
            return S.fullName(a).localeCompare(S.fullName(b));
          });
          postContactFilter.innerHTML = '<option value="">All contacts</option>';
          contacts.forEach(function (c) {
            var opt = new Option(S.fullName(c), c.id);
            if (c.id === currentVal) opt.selected = true;
            postContactFilter.add(opt);
          });
        }

        function render() {
          var list = S.all(),
            total = list.length;
          var q = $('q').value.trim().toLowerCase(),
            st = $('status').value,
            sv = $('service').value;
          var shown = list
            .filter(function (c) {
              var hay = [S.fullName(c), c.email, c.phone, c.address].join(' ').toLowerCase();
              return (
                (!q || hay.indexOf(q) > -1) && (!st || c.status === st) && (!sv || c.service === sv)
              );
            })
            .sort(function (a, b) {
              return S.fullName(a).localeCompare(S.fullName(b));
            });

          var filtered = q || st || sv;
          $('count').textContent = filtered
            ? shown.length + ' of ' + total + ' contacts'
            : total + (total === 1 ? ' contact' : ' contacts');

          rows.innerHTML = shown
            .map(function (c) {
              var d = S.due(c);
              return (
                '<tr data-id="' +
                c.id +
                '">' +
                '<td><div class="who"><span class="av" aria-hidden="true">' +
                S.esc(S.initials(c)) +
                '</span><div><b><a href="contact.html?id=' +
                c.id +
                '">' +
                S.esc(S.fullName(c)) +
                '</a></b><small>' +
                S.esc(c.email || c.phone) +
                '</small></div></div></td>' +
                '<td class="c-svc">' +
                S.esc(c.service) +
                '</td>' +
                '<td><span class="tag ' +
                S.tagClass(c.status) +
                '">' +
                S.esc(c.status) +
                '</span></td>' +
                '<td class="c-phone">' +
                S.esc(c.phone || '—') +
                '</td>' +
                '<td class="' +
                (d.late ? 'late' : c.followUp ? '' : 'muted') +
                '">' +
                d.text +
                '</td>' +
                '<td class="c-actions"><button type="button" class="btn btn-ghost btn-xs row-post-btn" data-contact-id="' +
                c.id +
                '" title="Add post for ' +
                S.esc(S.fullName(c)) +
                '">+ Post</button></td></tr>'
              );
            })
            .join('');

          table.hidden = !shown.length;
          empty.hidden = !!shown.length;
          if (!shown.length) {
            empty.innerHTML = total
              ? '<strong>No contacts match</strong>Clear the search or filters to see everyone.'
              : '<strong>No contacts yet</strong>Add your first contact to start tracking follow-ups.<br><button class="btn btn-violet" type="button" id="empty-new">+ New contact</button>';
            var b = $('empty-new');
            if (b) b.addEventListener('click', add);
          }
        }

        function renderPosts() {
          updateContactFilterOptions();
          var posts = S.allPosts();
          var total = posts.length;
          var q = postQ.value.trim().toLowerCase();
          var cf = postContactFilter.value;
          var tf = postTypeFilter.value;

          var shown = posts.filter(function (p) {
            var hay = [p.title, p.text, p.contactName, p.contactEmail, p.type]
              .join(' ')
              .toLowerCase();
            return (
              (!q || hay.indexOf(q) > -1) && (!cf || p.contactId === cf) && (!tf || p.type === tf)
            );
          });

          var filtered = q || cf || tf;
          $('posts-count').textContent = filtered
            ? shown.length + ' of ' + total + (total === 1 ? ' post' : ' posts')
            : total + (total === 1 ? ' post related to contacts' : ' posts related to contacts');

          var activeUser = S.getCurrentUser();
          var users = S.getUsers();

          postsList.innerHTML = shown
            .map(function (p) {
              var comments = S.allComments(p.id);
              var commentsHtml = comments
                .map(function (c) {
                  return (
                    '<div class="comment-item" data-comment-id="' +
                    c.id +
                    '" data-post-id="' +
                    p.id +
                    '">' +
                    '<span class="comment-av" aria-hidden="true">' +
                    S.esc((c.userName || 'U').slice(0, 2).toUpperCase()) +
                    '</span>' +
                    '<div class="comment-content">' +
                    '<div class="comment-header">' +
                    '<div class="comment-author-wrap">' +
                    '<span class="comment-author">' +
                    S.esc(c.userName) +
                    '</span>' +
                    '<span class="comment-role comment-role-' +
                    S.esc(c.userRole) +
                    '">' +
                    S.esc(c.userRole) +
                    '</span>' +
                    '<time class="comment-time" datetime="' +
                    c.at +
                    '">' +
                    S.fmtStamp(c.at) +
                    (c.updatedAt ? ' · (edited ' + S.fmtStamp(c.updatedAt) + ')' : '') +
                    '</time>' +
                    '</div>' +
                    '<div class="comment-actions">' +
                    '<button type="button" class="comment-btn-link comment-edit-btn" data-id="' +
                    c.id +
                    '">Edit</button>' +
                    '<button type="button" class="comment-btn-link danger comment-del-btn" data-id="' +
                    c.id +
                    '">Delete</button>' +
                    '</div>' +
                    '</div>' +
                    '<p class="comment-text" id="cmt-text-' +
                    c.id +
                    '">' +
                    S.esc(c.text) +
                    '</p>' +
                    '<div class="comment-edit-box" id="cmt-edit-box-' +
                    c.id +
                    '" hidden>' +
                    '<input class="comment-edit-input" id="cmt-edit-input-' +
                    c.id +
                    '" type="text" value="' +
                    S.esc(c.text) +
                    '" />' +
                    '<div class="comment-edit-actions">' +
                    '<button type="button" class="btn btn-ghost btn-xs cmt-edit-cancel" data-id="' +
                    c.id +
                    '">Cancel</button>' +
                    '<button type="button" class="btn btn-violet btn-xs cmt-edit-save" data-id="' +
                    c.id +
                    '">Save</button>' +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>'
                  );
                })
                .join('');

              var userOptions = users
                .map(function (u) {
                  return (
                    '<option value="' +
                    u.id +
                    '"' +
                    (u.id === activeUser.id ? ' selected' : '') +
                    '>' +
                    S.esc(u.name) +
                    ' (' +
                    S.esc(u.role) +
                    ')</option>'
                  );
                })
                .join('');

              return (
                '<article class="post-card" data-post-id="' +
                p.id +
                '" data-contact-id="' +
                p.contactId +
                '">' +
                '<div class="post-head">' +
                '<div class="post-author">' +
                '<span class="av" aria-hidden="true">' +
                S.esc(p.contactInitials) +
                '</span>' +
                '<div>' +
                '<div class="post-meta">' +
                '<a class="post-contact-name" href="contact.html?id=' +
                p.contactId +
                '"><b>' +
                S.esc(p.contactName) +
                '</b></a>' +
                '<span class="tag ' +
                S.tagClassForType(p.type) +
                '">' +
                S.esc(p.type) +
                '</span>' +
                '</div>' +
                '<time class="post-time" datetime="' +
                p.at +
                '">' +
                S.fmtStamp(p.at) +
                (p.updatedAt
                  ? ' <span class="muted">(edited ' + S.fmtStamp(p.updatedAt) + ')</span>'
                  : '') +
                '</time>' +
                '</div>' +
                '</div>' +
                '<div class="post-actions">' +
                '<button type="button" class="btn btn-ghost btn-xs post-edit-btn" data-id="' +
                p.id +
                '" aria-label="Edit post">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit' +
                '</button>' +
                '<button type="button" class="btn btn-danger btn-xs post-del-btn" data-id="' +
                p.id +
                '" aria-label="Delete post">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg> Delete' +
                '</button>' +
                '</div>' +
                '</div>' +
                (p.title ? '<h3 class="post-title">' + S.esc(p.title) + '</h3>' : '') +
                '<div class="post-body">' +
                S.esc(p.text) +
                '</div>' +
                '<div class="post-comments" data-post-id="' +
                p.id +
                '">' +
                '<div class="comments-head">' +
                '<div class="comments-count-title">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
                '<span>Comments (' +
                comments.length +
                ')</span>' +
                '</div>' +
                '</div>' +
                '<div class="comments-list">' +
                (commentsHtml ||
                  '<div class="no-comments">No comments yet. Be the first to comment.</div>') +
                '</div>' +
                '<form class="comment-form" data-post-id="' +
                p.id +
                '">' +
                '<div class="comment-form-row">' +
                '<label class="comment-user-label">' +
                '<span>Post as:</span>' +
                '<select class="comment-user-select" data-post-id="' +
                p.id +
                '">' +
                userOptions +
                '</select>' +
                '</label>' +
                '</div>' +
                '<div class="comment-input-row">' +
                '<input class="comment-input" type="text" placeholder="Write a comment..." required />' +
                '<button type="submit" class="btn btn-violet btn-xs comment-btn-submit">Comment</button>' +
                '</div>' +
                '</form>' +
                '</div>' +
                '</article>'
              );
            })
            .join('');

          postsList.hidden = !shown.length;
          postsEmpty.hidden = !!shown.length;
          if (!shown.length) {
            postsEmpty.innerHTML = total
              ? '<strong>No posts match</strong>Clear the search or filters to see all posts.'
              : '<strong>No posts yet</strong>Add your first post to track notes, calls, and updates for your contacts.<br><button class="btn btn-violet" type="button" id="empty-new-post">+ New post</button>';
            var empBtn = $('empty-new-post');
            if (empBtn)
              empBtn.addEventListener('click', function () {
                addPost();
              });
          }
        }

        function add() {
          S.openDialog(null, function () {
            render();
            renderPosts();
          });
        }

        function addPost(contactId) {
          S.openPostDialog(null, contactId || postContactFilter.value, function () {
            render();
            renderPosts();
          });
        }

        $('new-btn').addEventListener('click', add);
        $('new-post-btn').addEventListener('click', function () {
          addPost();
        });
        var topPostBtn = $('new-post-top-btn');
        if (topPostBtn)
          topPostBtn.addEventListener('click', function () {
            addPost();
          });

        ['q', 'status', 'service'].forEach(function (id) {
          $(id).addEventListener('input', render);
        });
        [postQ, postContactFilter, postTypeFilter].forEach(function (el) {
          el.addEventListener('input', renderPosts);
          el.addEventListener('change', renderPosts);
        });

        rows.addEventListener('click', function (e) {
          var postBtn = e.target.closest('.row-post-btn');
          if (postBtn) {
            e.stopPropagation();
            addPost(postBtn.dataset.contactId);
            return;
          }
          var tr = e.target.closest('tr[data-id]');
          if (tr && !e.target.closest('a')) location.href = 'contact.html?id=' + tr.dataset.id;
        });

        postsList.addEventListener('click', function (e) {
          var editBtn = e.target.closest('.post-edit-btn');
          if (editBtn) {
            var post = S.getPost(editBtn.dataset.id);
            if (post) {
              S.openPostDialog(post, post.contactId, function () {
                render();
                renderPosts();
              });
            }
            return;
          }
          var delBtn = e.target.closest('.post-del-btn');
          if (delBtn) {
            var pToDelete = S.getPost(delBtn.dataset.id);
            var name = pToDelete ? pToDelete.contactName : 'this contact';
            if (confirm('Delete this post for ' + name + '? This cannot be undone.')) {
              S.removePost(delBtn.dataset.id);
              S.toast('Post deleted');
              render();
              renderPosts();
            }
            return;
          }

          // Resource #3: Comment Edit Button
          var cmtEditBtn = e.target.closest('.comment-edit-btn');
          if (cmtEditBtn) {
            var cId = cmtEditBtn.dataset.id;
            var textBox = $('cmt-text-' + cId);
            var editBox = $('cmt-edit-box-' + cId);
            var editInput = $('cmt-edit-input-' + cId);
            if (textBox && editBox) {
              textBox.hidden = true;
              editBox.hidden = false;
              if (editInput) {
                editInput.focus();
                editInput.select();
              }
            }
            return;
          }

          // Comment Edit Cancel
          var cmtCancelBtn = e.target.closest('.cmt-edit-cancel');
          if (cmtCancelBtn) {
            var cancelId = cmtCancelBtn.dataset.id;
            var tb = $('cmt-text-' + cancelId);
            var eb = $('cmt-edit-box-' + cancelId);
            if (tb && eb) {
              tb.hidden = false;
              eb.hidden = true;
            }
            return;
          }

          // Comment Edit Save
          var cmtSaveBtn = e.target.closest('.cmt-edit-save');
          if (cmtSaveBtn) {
            var saveId = cmtSaveBtn.dataset.id;
            var inp = $('cmt-edit-input-' + saveId);
            var newText = inp ? inp.value.trim() : '';
            if (!newText) {
              alert('Comment cannot be empty.');
              return;
            }
            S.saveComment({ id: saveId, text: newText });
            S.toast('Comment updated');
            renderPosts();
            return;
          }

          // Comment Delete
          var cmtDelBtn = e.target.closest('.comment-del-btn');
          if (cmtDelBtn) {
            if (confirm('Delete this comment? This cannot be undone.')) {
              S.removeComment(cmtDelBtn.dataset.id);
              S.toast('Comment deleted');
              renderPosts();
            }
            return;
          }
        });

        // Create Comment Submission
        postsList.addEventListener('submit', function (e) {
          var form = e.target.closest('.comment-form');
          if (form) {
            e.preventDefault();
            var postId = form.dataset.postId;
            var userSelect = form.querySelector('.comment-user-select');
            var input = form.querySelector('.comment-input');
            var text = input ? input.value.trim() : '';
            if (!text) return;
            var userId = userSelect ? userSelect.value : S.getCurrentUser().id;
            S.setCurrentUser(userId);
            S.saveComment({ postId: postId, userId: userId, text: text });
            S.toast('Comment added');
            renderPosts();
          }
        });

        // Allow pressing Enter in comment edit field to save
        postsList.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && e.target.classList.contains('comment-edit-input')) {
            e.preventDefault();
            var editBox = e.target.closest('.comment-edit-box');
            if (editBox) {
              var saveBtn = editBox.querySelector('.cmt-edit-save');
              if (saveBtn) saveBtn.click();
            }
          }
        });

        render();
        renderPosts();
      })();
    </script>
  </body>
</html>
